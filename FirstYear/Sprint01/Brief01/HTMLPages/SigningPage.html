<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/GlobalStyle.css">
    <link rel="stylesheet" href="../CSS/Loging.css">
    <title>sign in</title>
</head>
<body>
    <main>
        <div>
            <small>TES PREMIERS PAS À YOUCODE</small>
            <h1>Ton aventure commence par une rencontre</h1>
        </div>
        <form action="">
            <div class="inputContainer">
                <label for="inpFirstName">Nom</label>
                <input id="inpFirstName" type="text" placeholder="ex: Chouaib" required>
            </div>
            <div class="inputContainer">
                <label for="inpLastName">Prenom</label>
                <input id="inpLastName" type="text" placeholder="ex: Hadadi" required>
            </div>
            <div class="inputContainer">
                <label for="inpEmail">Email</label>
                <input id="inpEmail" type="email" placeholder="ex: Hadadi@gmial.com" required>
            </div>
            <div class="inputContainer">
                <label for="inpPhonr">Phone</label>
                <input id="inpPhone" type="tel" placeholder="ex: 0637009210">
            </div>


            <fieldset>
                
            <div>
                <label for="Safi">Safi</label>
            <input name="city" id="Safi" type="radio" value="Safi">
            </div>

            <div>
                <label for="Youssoufia">Youssoufia</label>
            <input name="city" id="Youssoufia" type="radio" value="Youssoufia">
            </div>
            
            <div>
                 <label for="Nador">Nador</label>
            <input name="city" id="Nador" type="radio" value="Nador">
            </div>
            
            </fieldset>
            

            <button type="submit">S'inscrire</button>

        </form>

        

    </main>
</body>
</html>
